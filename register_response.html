<div class="row">
    <div class="col-md-6">
        <form method="post" action="/Account/Register">
    
            
            <div class="form-group">
                <label class="control-label" for="FullName">Full Name</label>
                <input class="form-control" type="text" data-val="true" data-val-maxlength="The field Full Name must be a string or array type with a maximum length of &#x27;100&#x27;." data-val-maxlength-max="100" data-val-required="The Full Name field is required." id="FullName" maxlength="100" name="FullName" value="" />
                <span class="text-danger field-validation-valid" data-valmsg-for="FullName" data-valmsg-replace="true"></span>
            </div>
            <div class="form-group">
                <label class="control-label" for="Email">Email</label>
                <input class="form-control" type="email" data-val="true" data-val-email="The Email field is not a valid e-mail address." data-val-required="The Email field is required." id="Email" name="Email" value="" />
                <span class="text-danger field-validation-valid" data-valmsg-for="Email" data-valmsg-replace="true"></span>
            </div>
            <div class="form-group">
                <label class="control-label" for="PhoneNumber">Phone Number</label>
                <input class="form-control" type="tel" data-val="true" data-val-phone="The Phone Number field is not a valid phone number." data-val-required="The Phone Number field is required." id="PhoneNumber" name="PhoneNumber" value="" />
                <span class="text-danger field-validation-valid" data-valmsg-for="PhoneNumber" data-valmsg-replace="true"></span>
            </div>
            <div class="form-group">
                <label class="control-label" for="Password">Password</label>
                <input class="form-control" type="password" data-val="true" data-val-minlength="The field Password must be a string or array type with a minimum length of &#x27;6&#x27;." data-val-minlength-min="6" data-val-required="The Password field is required." id="Password" name="Password" />
                <span class="text-danger field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
            </div>
            <div class="form-group">
                <label class="control-label" for="ConfirmPassword">Confirm Password</label>
                <input class="form-control" type="password" data-val="true" data-val-equalto="The password and confirmation password do not match." data-val-equalto-other="*.Password" data-val-required="The Confirm Password field is required." id="ConfirmPassword" name="ConfirmPassword" />
                <span class="text-danger field-validation-valid" data-valmsg-for="ConfirmPassword" data-valmsg-replace="true"></span>
            </div>
            <div class="form-group">
                <label class="control-label" for="Role">Role</label>
                <select class="form-control" data-val="true" data-val-required="The Role field is required." id="Role" name="Role">
                    <option value="">-- Select Role --</option>
                    <option value="Driver">Driver</option>
                    <option value="Rider">Rider</option>
                </select>
                <span class="text-danger field-validation-valid" data-valmsg-for="Role" data-valmsg-replace="true"></span>
            </div>
            <div class="form-group">
                <input type="submit" value="Register" class="btn btn-primary" />
